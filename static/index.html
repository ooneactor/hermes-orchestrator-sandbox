<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Synthetic Monitoring Dashboard</title>
<link rel="stylesheet" href="/static/style.css">
<script src="/static/app.js" defer></script>
</head>
<body>
<main>
<header>
<div>
<p class="eyebrow">TEST ENVIRONMENT</p>
<h1>Synthetic Monitoring Dashboard</h1>
<p class="muted">Synthetic data only. No production connections.</p>
</div>
<button id="refresh" type="button">Refresh</button>
</header>
<section aria-labelledby="nodes-heading">
<h2 id="nodes-heading">Infrastructure nodes</h2>
<p id="message" role="status" aria-live="polite">Loading...</p>
<div class="table-wrap">
<table>
<thead><tr>
<th scope="col">Node</th>
<th scope="col">Status</th>
<th scope="col">CPU</th>
<th scope="col">Memory</th>
</tr></thead>
<tbody id="nodes"></tbody>
</table>
</div>
</section>
</main>
</body>
</html>
